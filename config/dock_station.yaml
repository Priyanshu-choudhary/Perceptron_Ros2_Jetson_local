# Backup of the robot's taught dock station (room map, charger against the
# wall). The live copy is /opt/perceptron_ws/config/dock_station.yaml inside
# the chroot; after reflashing the SD card, restore it with
#   scp config/dock_station.yaml jetson@<jetson-ip>:/mnt/sdcard/ros2_chroot/opt/perceptron_ws/config/
# or re-teach: robot on the charger, `robot dock-teach`.
#
# Charging dock, written by `robot dock-teach` and `robot dock X Y YAW`.
# board_in_base: the dock board's 3D pose in base_footprint while docked
#   and charging - THE docking target. robot_in_board: the same, planar and
#   inverted (board frame: origin under the board centre, +x out of its face).
# camera_correction: rotation applied to the URDF camera mount, measured by
#   teach from a straight reverse (pitch/pan in degrees are for reading).
# predock: map-frame pose Nav2 drives to before the camera takes over.
# dock_map_pose: where AMCL put the robot when it was taught (info only).
