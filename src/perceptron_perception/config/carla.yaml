# CARLA (ros2 run perceptron_carla carla_bridge). Frame names already match the URDF;
# only topics differ, and intrinsics come from the bridge's CameraInfo (pinhole, no distortion).
lidar_camera_overlay_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /carla/camera/image_raw
    cloud_topic: /carla/lidar/points
    camera_info_topic: /carla/camera/camera_info
    max_range: 60.0
    colour_max_depth: 40.0
    # 90 deg FOV pinhole: the image corner is r = 1.15, so 2.35 is still a no-op guard here
    max_radius: 2.35

projection_check_node:
  ros__parameters:
    use_sim_time: true
    depth_topic: /carla/camera/depth
    cloud_topic: /carla/lidar/points
    camera_info_topic: /carla/camera/camera_info
    max_range: 100.0
    report_period: 5.0

lidar_preprocessor_node:
  ros__parameters:
    use_sim_time: true
    cloud_topic: /carla/lidar/points
    target_frame: base_footprint
    # The rover rig sits 2.04 m ahead of the Microlino's rear axle and its lidar sees the
    # car behind it. carla_bridge logs the host box at start-up (and in /carla/bridge_info);
    # this is that box plus ~15 cm. On the real rover use the rover's own body instead.
    self_box_enabled: true
    self_box: [-0.45, 2.0, -0.9, 0.9, -0.3, 1.55]
    max_range: 50.0
    # 3, not the node default 6: the rover lidar puts only 4-7 points on a person at 10-40 m
    # (pedestrian recall 22-55 % -> 99.6-100 %); costs ~10 more small scenery clusters per frame.
    cluster_min_points: 3

cloud_eval_node:
  ros__parameters:
    use_sim_time: true
