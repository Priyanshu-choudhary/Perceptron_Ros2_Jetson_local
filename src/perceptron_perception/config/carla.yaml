# CARLA (ros2 run perceptron_carla carla_bridge). Frame names already match the URDF;
# only topics differ, and intrinsics come from the bridge's CameraInfo (pinhole, no distortion).
lidar_camera_overlay_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /carla/camera/image_raw
    cloud_topic: /carla/lidar/points
    camera_info_topic: /carla/camera/camera_info
    max_range: 60.0
    colour_max_depth: 40.0
    # 90 deg FOV pinhole: the image corner is r = 1.15, so 2.35 is still a no-op guard here
    max_radius: 2.35

projection_check_node:
  ros__parameters:
    use_sim_time: true
    depth_topic: /carla/camera/depth
    cloud_topic: /carla/lidar/points
    camera_info_topic: /carla/camera/camera_info
    max_range: 100.0
    report_period: 5.0

lidar_preprocessor_node:
  ros__parameters:
    use_sim_time: true
    cloud_topic: /carla/lidar/points
    target_frame: base_footprint
    # The rover rig sits 2.04 m ahead of the Microlino's rear axle and its lidar sees the
    # car behind it. carla_bridge logs the host box at start-up (and in /carla/bridge_info);
    # this is that box plus ~15 cm. On the real rover use the rover's own body instead.
    self_box_enabled: true
    self_box: [-0.45, 2.0, -0.9, 0.9, -0.3, 1.55]
    max_range: 50.0
    # 3, not the node default 6: the rover lidar puts only 4-7 points on a person at 10-40 m
    # (pedestrian recall 22-55 % -> 99.6-100 %); costs ~10 more small scenery clusters per frame.
    cluster_min_points: 3

cloud_eval_node:
  ros__parameters:
    use_sim_time: true

object_fusion_node:
  ros__parameters:
    use_sim_time: true
    # the CARLA reference detector; swap for your own model's Detection2DArray topic
    detections_topic: /carla/ground_truth/boxes_2d
    camera_info_topic: /carla/camera/camera_info
    image_topic: /carla/camera/image_raw

fusion_eval_node:
  ros__parameters:
    use_sim_time: true

object_tracker_node:
  ros__parameters:
    use_sim_time: true
    tracking_frame: odom
    vehicle:
      sigma_a: 1.5        # smoother than the default 3.0: city run 25 -> 20 id switches
      r_floor: 0.6        # the near-face centroid slides along a car as the view changes

tracking_eval_node:
  ros__parameters:
    use_sim_time: true

trajectory_predictor_node:
  ros__parameters:
    use_sim_time: true

prediction_eval_node:
  ros__parameters:
    use_sim_time: true

costmap_node:
  ros__parameters:
    use_sim_time: true
    # The vehicle driving in CARLA is the Microlino host (2.2 x 1.5 m, 1.4 m tall), so the
    # footprint is ITS size here; the node defaults are the rover's own nav2 values
    # (inscribed 0.21 m, inflation 0.6 m, scaling 2.5).
    inscribed_radius: 0.75
    inflation_radius: 1.8
    cost_scaling: 2.0
    max_obstacle_height: 1.6
    nominal_speed: 3.0          # autopilot drives the host at ~4-6 m/s

costmap_eval_node:
  ros__parameters:
    use_sim_time: true
