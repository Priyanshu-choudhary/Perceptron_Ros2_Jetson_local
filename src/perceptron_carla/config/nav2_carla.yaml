# Nav2 for the CARLA host car (Microlino: Ackermann, 2.2 x 1.5 m, wheelbase 1.53 m), Stage 11.
#
# Planning and control for a car, not the rover's skid-steer base:
#   planner     Smac Hybrid-A* (Dubins): paths the car can drive, turning radius >= 3 m
#               (the bridge limits steering to 35 deg: radius 2.18 m, so 3 m leaves slack)
#   controller  Regulated Pure Pursuit: follows the path, slows for curvature and cost,
#               stops if the arc to its carrot collides; no rotate-in-place
#   recovery    clear costmaps, wait 3 s (config/carla_nav_bt.xml): no spin, and no backing up --
#               the car cannot see behind itself (a BackUp reversed into a pedestrian)
#   safety      predictive_speed_limit_node: /speed_limit from Stage 7 predictions crossing the
#               plan (yield before a pedestrian walks into the path); collision_monitor between
#               the controller and the car (/cmd_vel_nav -> /cmd_vel): stop / slow down for lidar
#               points just ahead of the nose, whatever the planner thinks
# Costmaps take the Stage 8 map /costmap/nav (lethal obstacles + predicted risk of moving
# objects; unknown read as free) through a StaticLayer, and inflate it with this car's footprint.
# The rover's own Nav2 setup (perceptron_navigation/config) is untouched.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.3

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    odom_topic: /odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0          # waiting for a pedestrian to cross is progress too
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 2.0
      yaw_goal_tolerance: 6.28               # a car arrives at whatever heading the road gives
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 2.5
      # short carrot near obstacles: RPP checks a constant-curvature arc to the carrot, and a long
      # one cut through a pole the plan went round (stuck 80 s at a junction corner, nav_mixed)
      lookahead_dist: 3.0
      min_lookahead_dist: 1.5
      max_lookahead_dist: 6.0
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.4
      approach_velocity_scaling_dist: 4.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 6.0
      regulated_linear_scaling_min_speed: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.0       # = the inflation layers' cost_scaling_factor
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.2
      # optimistic: unknown (beyond the lidar, behind the car's own body) is planned through as
      # free. As NO_INFORMATION it costs Smac 3x per cell (40 m plans: 0.04 s -> 0.9-1.5 s) and
      # blocks BackUp, whose blind zone is always unknown. Obstacles appear as the lidar sees them.
      track_unknown_space: false
      always_send_full_costmap: true
      # Microlino body (host box -0.26..1.94 m) + the sensor rig at its nose, in base_footprint (rear axle)
      footprint: "[[-0.30, -0.80], [-0.30, 0.80], [2.10, 0.80], [2.10, -0.80]]"
      footprint_padding: 0.05
      plugins: ["perception_layer", "inflation_layer"]
      perception_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /costmap/nav
        map_subscribe_transient_local: false
        subscribe_to_updates: false
        trinary_costmap: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.8
        cost_scaling_factor: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 4.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      rolling_window: true
      # sub-goals come up to 1.5 x subgoal_spacing (45 m) ahead: the window must hold them
      width: 120
      height: 120
      resolution: 0.2
      # optimistic: unknown (beyond the lidar, behind the car's own body) is planned through as
      # free. As NO_INFORMATION it costs Smac 3x per cell (40 m plans: 0.04 s -> 0.9-1.5 s) and
      # blocks BackUp, whose blind zone is always unknown. Obstacles appear as the lidar sees them.
      track_unknown_space: false
      always_send_full_costmap: true
      footprint: "[[-0.30, -0.80], [-0.30, 0.80], [2.10, 0.80], [2.10, -0.80]]"
      footprint_padding: 0.05
      plugins: ["perception_layer", "inflation_layer"]
      perception_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /costmap/nav
        map_subscribe_transient_local: false
        subscribe_to_updates: false
        trinary_costmap: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.8
        cost_scaling_factor: 2.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 1.0
      allow_unknown: true                    # beyond the lidar's 20 m the map is unknown, not blocked
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.5
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 3.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 3.0                      # keep plans off obstacles (corner-cutting by poles)
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 8.0
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator", "collision_monitor"]

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.3
    source_timeout: 1.0                      # no lidar for 1 s: stop
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["StopZone", "SlowZone"]
    # base_footprint is the rear axle; the nose (with the sensor rig) is at x = 2.1
    StopZone:
      type: "polygon"
      points: [2.1, 1.0, 3.4, 1.0, 3.4, -1.0, 2.1, -1.0]
      action_type: "stop"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_stop"
    SlowZone:
      type: "polygon"
      points: [2.1, 1.2, 7.0, 1.2, 7.0, -1.2, 2.1, -1.2]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.4
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
    observation_sources: ["obstacles"]
    obstacles:
      type: "pointcloud"
      topic: "/perception/points_obstacles"
      min_height: 0.2                        # above kerbs (0.15 m); the lidar sees legs up to 0.42 m
      max_height: 1.8

predictive_speed_limit_node:
  ros__parameters:
    use_sim_time: true
    half_width: 0.8
    nose: 2.1
    gap: 1.5
    margin: 0.5
    decel: 2.0
    release_speed: 4.0

gps_goal_node:
  ros__parameters:
    use_sim_time: true
    datum_lat: 19.1334                       # = carla_bridge --gnss-origin
    datum_lon: 72.9133
    datum_frame: carla_world
    route_mode: roads                        # shortest road route, any lane, either way
    subgoal_spacing: 30.0
    advance_radius: 12.0
    goal_tolerance: 3.0                      # ~ one car length: a 3 m turning radius cannot null a
                                             # 1-2 m side offset without going round again
